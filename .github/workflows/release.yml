name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.0 or v0.1.0-beta.1)'
        required: true
      prerelease:
        description: 'Is this a pre-release?'
        type: boolean
        default: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            platform: darwin
            arch: arm64
            zig-target: aarch64-macos.14.0
          - os: macos-15-intel
            platform: darwin
            arch: x64
            zig-target: x86_64-macos.14.0
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            zig-target: x86_64-linux-gnu.2.35
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            zig-target: aarch64-linux-gnu.2.35
          - os: windows-2025
            platform: win32
            arch: x64
            zig-target: x86_64-windows-msvc
          # zig 0.16.0's aarch64-windows compiler exits immediately on the
          # windows-11-arm runner (no output); cross-compile from x64 instead
          # and skip native tests for this artifact only.
          - os: windows-2025
            platform: win32
            arch: arm64
            zig-target: aarch64-windows-msvc
            cross: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build library and CLI
        run: |
          zig build -Doptimize=ReleaseFast -Dcpu=baseline -Dtarget=${{ matrix.zig-target }}

      - name: Validate release contract
        run: node --test scripts/release-contract.test.js

      - name: Verify macOS deployment target
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          for artifact in zig-out/bin/zig-asar zig-out/lib/libasar.dylib; do
            minos="$(otool -l "$artifact" | awk '$1 == "minos" { print $2; exit }')"
            if [ "$minos" != "14.0" ]; then
              echo "$artifact requires macOS $minos; expected 14.0"
              exit 1
            fi
          done

      - name: Run tests
        if: matrix.cross != true
        run: |
          zig build test

      - name: Verify Intel Mach-O code-signing header capacity
        if: matrix.platform == 'darwin' && matrix.arch == 'x64'
        shell: bash
        run: |
          for artifact in zig-out/lib/libasar.dylib; do
            sizeofcmds=$(otool -hv "$artifact" | tail -1 | awk '{print $7}')
            text_offset=$(otool -l "$artifact" | awk '$1 == "sectname" && $2 == "__text" { found = 1 } found && $1 == "offset" { print $2; exit }')
            headerpad=$((text_offset - 32 - sizeofcmds))
            if [ "$headerpad" -lt 4096 ]; then
              echo "$artifact has only $headerpad bytes of Mach-O header padding"
              exit 1
            fi
            echo "Verified $artifact: $headerpad bytes of Mach-O header padding"
          done

      - name: Package binaries
        run: |
          node scripts/package-binaries.js

      - name: Create tarball
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.platform }}" = "win32" ]; then
            tar -czf ../zig-asar-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz zig-asar.exe libasar.dll libasar.lib
          elif [ "${{ matrix.platform }}" = "darwin" ]; then
            tar -czf ../zig-asar-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz zig-asar libasar.dylib
          else
            tar -czf ../zig-asar-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz zig-asar libasar.so
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zig-asar-${{ matrix.platform }}-${{ matrix.arch }}
          path: zig-asar-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish immutable release to R2
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/upload-release-r2.js --artifacts=artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.tar.gz.sha256
          generate_release_notes: true
          prerelease: ${{ github.event.inputs.prerelease || contains(github.ref_name, '-beta') || contains(github.event.inputs.tag, '-beta') }}
          body: |
            zig-asar release

            Pre-built binaries for:
            - **macOS** (arm64 & x64): `zig-asar-darwin-[arch].tar.gz`
            - **Linux** (x64 & arm64): `zig-asar-linux-[arch].tar.gz`
            - **Windows** (x64 & arm64): `zig-asar-win32-[arch].tar.gz`

            Each tarball contains:
            - `zig-asar` (or `zig-asar.exe` on Windows) - CLI tool for packing/unpacking ASAR archives
            - `libasar.{dylib,so,dll}` - Dynamic library for use with native code
            - `libasar.lib` (Windows only) - Import library for linking

            ## Usage

            ### CLI Tool
            ```bash
            tar -xzf zig-asar-darwin-arm64.tar.gz
            ./zig-asar pack myapp app.asar
            ./zig-asar pack myapp app.asar --unpack *.node --unpack *.dll
            ./zig-asar list app.asar
            ./zig-asar extract app.asar views/index.html
            ```

            ### Library (C FFI)
            Link against `libasar.{dylib,so,dll}` from your native code.
            See [README.md](https://github.com/blackboardsh/zig-asar/blob/main/README.md) for API documentation.
